version: "1"
apiVersion: governance.toolkit/v1
name: evil-mcp-lab-policy
default_action: allow

rules:
  - name: block-destructive
    condition: "action.type == 'drop'"
    action: deny
    description: "Block destructive actions"

  - name: block-path-traversal
    condition: "'../' in path or '/etc/' in path"
    action: deny
    description: "Block obvious traversal and system path access attempts"

  - name: block-credential-paths
    condition: "'.ssh' in path or '.env' in path or 'id_rsa' in path or 'credentials' in path"
    action: deny
    description: "Block attempts to access credential-looking file paths"
